name: backlog-loop

on:
  pull_request:
    paths:
      - "skills/backlog-loop/**"
      - ".github/workflows/backlog-loop.yml"
  push:
    branches: [main]
    paths:
      - "skills/backlog-loop/**"
      - ".github/workflows/backlog-loop.yml"

permissions:
  contents: read

jobs:
  test:
    name: shellcheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: |
          bash --version | head -n 1
          git --version
          jq --version
          shellcheck --version | sed -n 2p
      - name: Run the suite
        run: bash skills/backlog-loop/tests/run.sh

name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: uv run --frozen pytest tests
      - run: node --test tests-js/

  # BSD and GNU sed disagree, and that has already produced a real bug here.
  # The known cases are caught statically on Linux by test_no_gnu_only_*, which
  # is what gates a PR. This job is the canary for the rest — BSD-only argument
  # handling, bash 3.2 on stock macOS — and runs after merge rather than on
  # every PR, because a macOS runner queues for minutes to run a 2-second suite.
  validate-macos:
    name: validate (macOS canary)
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: uv run --frozen pytest tests
      - run: node --test tests-js/

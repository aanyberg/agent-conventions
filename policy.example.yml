# .planning/policy.yml — project rules read by the conventions plugin skills
# (backlog-management, task-workflow, git-conventions, architecture-planning).
#
# You should not need to write this file by hand: the first time a
# policy-dependent skill needs it and finds it missing, it generates a copy
# of this template at <root>/.planning/policy.yml (backend auto-detected,
# everything else a conservative best-practice default) via
# skills/backlog-management/scripts/generate-policy.sh, and reports what it
# generated. Nothing here is ever overwritten automatically after that —
# edit any value below directly and it takes effect on the next run.

backlog:
  # auto: github-issues if the origin remote is on github.com, `gh auth
  # status` succeeds, and the repo has Issues enabled; otherwise markdown
  # (BACKLOG.md at the repo root). Set explicitly to skip detection.
  backend: auto
  render_file: BACKLOG.md
  needs_discussion_expiry_days: 14
  max_open_backlog: 50

ids:
  scheme: numeric # numeric ("001") | prefixed ("LMS-001", see prefixes)
  prefixes: []

statuses:
  agent_selectable: [ready]

git:
  commit_types: [feat, fix, chore, docs, refactor, test]
  branch_format: "<type>/<id>-<short-kebab-description>"

versioning:
  bump: release-commit-only # release-commit-only | per-branch

autonomous:
  allowed_types: [feat, fix, chore, docs, refactor, test]
  max_diff_lines: 400
  max_files: 15
  task_wall_clock_min: 60
  # Globs. A PR touching any of these gets `needs-human`; an agent never merges it.
  require_human_review_if_touches:
    - ".github/workflows/**"
    - "**/migrations/**"
    - "pyproject.toml"
    - "package.json"
    - "package-lock.json"
    - "pnpm-lock.yaml"
    - "Cargo.toml"
  forbidden:
    - force-push
    - edit-branch-protection
    - add-dependency-without-human-label
    - delete-or-skip-test

worktrees:
  up: scripts/worktree-up.sh
  down: scripts/worktree-down.sh

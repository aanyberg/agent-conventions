# Not a Python package. This file exists only so `uv` can pin the two
# dependencies the structural validation suite needs (shellcheck-py
# vendors the shellcheck binary, so CI needs no separate install), and hold pytest's
# config. Nothing here is built, installed, or published.

[project]
name = "agent-conventions"
version = "0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pyyaml>=6.0",
  "shellcheck-py>=0.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
